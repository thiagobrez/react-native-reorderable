name: iOS 26 preflight contract diagnostic
on:
  workflow_dispatch:
    inputs:
      agent_device_sha:
        description: Optional full agent-device commit SHA to build for Apple validation
        required: false
        type: string
      channel:
        description: Validation channel recorded with the candidate
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - prerelease
          - dry-run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name ==
    'push' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: Pack and inspect the candidate once
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build and pack once
        run: |
          yarn prepare
          yarn pack:candidate
      - name: Inspect metadata, contents, entrypoints, and type surfaces
        env:
          CANDIDATE_CHANNEL: ${{ inputs.channel || (github.event_name == 'schedule' &&
            'nightly') || 'release' }}
        run: |
          node scripts/verify-package-artifact.mjs \
            artifacts/candidate/react-native-reorderable.tgz \
            --manifest artifacts/candidate/manifest.json
      - name: Record immutable candidate identity
        id: manifest
        run: >
          echo "sha256=$(node -p
          "require('./artifacts/candidate/manifest.json').sha256")" >>
          "$GITHUB_OUTPUT"
      - name: Upload only the inspected candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          if-no-files-found: error
          retention-days: 30
          path: artifacts/candidate/
  contract:
    name: ${{ matrix.configuration }} / RN 0.85
    needs: candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: ios26.auto-fallback
            runner: macos-26
            runtime: iOS 26.5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build the requested Agent Device revision
        if: runner.os == 'macOS' && inputs.agent_device_sha != ''
        uses: ./.github/actions/build-agent-device
        with:
          sha: ${{ inputs.agent_device_sha }}
      - name: Download inspected candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate
          path: artifacts/candidate
      - name: Install the inspected tarball into the Scenario Lab
        run: |
          node scripts/install-candidate-in-example.mjs artifacts/candidate/react-native-reorderable.tgz
          yarn install --no-immutable
          test "$(node -p "require('./example/node_modules/react-native-reorderable/package.json').name")" = react-native-reorderable
      - name: Verify designated React Native baseline
        run: node -e
          "if(require('./package.json').devDependencies['react-native']!=='0.85.0')process.exit(1)"
      - name: Cache cocoapods
        if: runner.os == 'macOS'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-contract-cocoapods-${{
            hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-contract-cocoapods-
      - name: Verify Apple runtime and prepare native app
        if: runner.os == 'macOS'
        run: |
          xcrun simctl list runtimes | grep -F '${{ matrix.runtime }}'
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install wix/brew/applesimutils
          # Always run pod install, even on a Pods cache hit: React Native
          # codegen runs inside pod install and writes its sources to
          # example/ios/build/generated, which is outside the cached Pods
          # directory, so a restored cache alone leaves the ReactCodegen pod
          # target pointing at files that do not exist. The cache still pays
          # for itself by keeping the Pods checkout warm.
          (
            cd example
            bundle install
            bundle exec pod install --project-directory=ios
          )
          # build-framework-cache must run before detox build: without a
          # prebuilt framework cache, Detox compiles it lazily mid-build and
          # the Apple contract build fails on hosted runners.
          yarn detox build-framework-cache
          yarn detox build --configuration '${{ matrix.configuration }}'
      - name: Run Apple contract with one retained whole-job retry
        if: runner.os == 'macOS'
        run: node scripts/run-device-contract-job.mjs '${{ matrix.configuration }}'
      - name: Enable KVM
        if: runner.os == 'Linux'
        run: >
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node"'
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules

          sudo udevadm trigger --name-match=kvm
      - name: Run Android contract with one retained whole-job retry
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: Pixel_10_Pro
          disable-animations: false
          script: >
            yarn detox build --configuration '${{ matrix.configuration }}'

            node scripts/run-device-contract-job.mjs '${{ matrix.configuration
            }}'
      - name: Upload exact device artifacts and recordings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-39-${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/issue-39/detox/${{ matrix.configuration }}/
            artifacts/issue-39/device-tables/${{ matrix.configuration }}*.json
            artifacts/issue-39/outcomes-by-case/${{ matrix.configuration }}/
            artifacts/issue-39/outcomes/${{ matrix.configuration }}.json
            artifacts/issue-39/agent-device/${{ matrix.configuration }}/
